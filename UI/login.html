<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Berger LMS Portal</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #512da8; /* Berger Purple */
            --primary-dark: #311b92;
            --accent: #ffd600; /* Berger Yellow */
            --bg-gradient: linear-gradient(135deg, #2e1a47 0%, #0c0817 100%);
            --card-bg: rgba(255, 255, 255, 0.05);
            --border-color: rgba(255, 255, 255, 0.1);
            --text: #ffffff;
            --text-muted: #b0aec4;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
        }

        body {
            background: var(--bg-gradient);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .login-container {
            width: 100%;
            max-width: 440px;
            background: rgba(18, 11, 36, 0.85);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            padding: 40px;
            backdrop-filter: blur(20px);
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5);
            text-align: center;
        }

        .logo-container {
            margin-bottom: 30px;
        }

        .logo-container img {
            max-height: 55px;
            display: block;
            margin: 0 auto;
        }

        .login-header h1 {
            font-family: 'Outfit', sans-serif;
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 8px;
            background: linear-gradient(90deg, #ffffff 0%, var(--accent) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .login-header p {
            color: var(--text-muted);
            font-size: 14px;
            margin-bottom: 30px;
        }

        .form-group {
            margin-bottom: 20px;
            text-align: left;
        }

        .form-group label {
            display: block;
            color: var(--text-muted);
            font-size: 13px;
            font-weight: 500;
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .form-control {
            width: 100%;
            padding: 14px 16px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            color: #ffffff;
            font-size: 15px;
            outline: none;
            transition: all 0.3s ease;
        }

        .form-control:focus {
            border-color: var(--accent);
            background: rgba(255, 255, 255, 0.08);
            box-shadow: 0 0 10px rgba(255, 214, 0, 0.15);
        }

        .btn-login {
            width: 100%;
            padding: 14px;
            background: linear-gradient(90deg, var(--primary) 0%, var(--primary-dark) 100%);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            color: #ffffff;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(81, 45, 168, 0.3);
            margin-top: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .btn-login:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(81, 45, 168, 0.5);
            border-color: var(--accent);
        }

        .btn-login:active {
            transform: translateY(0);
        }

        .error-message {
            background: rgba(239, 83, 80, 0.1);
            border: 1px solid rgba(239, 83, 80, 0.3);
            color: #ef5350;
            padding: 12px;
            border-radius: 10px;
            font-size: 13px;
            margin-bottom: 20px;
            display: none;
            text-align: left;
        }

        /* Spinner */
        .spinner {
            width: 20px;
            height: 20px;
            border: 2.5px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top-color: #ffffff;
            animation: spin 0.8s linear infinite;
            display: none;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>

    <div class="login-container">
        <div class="logo-container">
            <img src="assets/berger_logo.png" alt="Berger Paints Logo" onerror="this.src='https://lms-berger-ui.vercel.app/assets/berger_logo.png'">
        </div>
        <div class="login-header">
            <h1>Lead Management Portal</h1>
            <p>Enter your credentials to access your dashboard</p>
        </div>

        <div class="error-message" id="errorMessage">
            Invalid username or password. Please try again.
        </div>

        <form id="loginForm" onsubmit="handleLogin(event)">
            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" class="form-control" placeholder="e.g. johndoe" required autocomplete="username">
            </div>
            <div class="form-group" style="margin-bottom: 30px;">
                <label for="password">Password</label>
                <input type="password" id="password" class="form-control" placeholder="••••••••" required autocomplete="current-password">
            </div>

            <button type="submit" class="btn-login" id="btnLogin">
                <span>Sign In</span>
                <div class="spinner" id="btnSpinner"></div>
            </button>
        </form>
    </div>

    <!-- Configuration Parameter Script -->
    <script src="config.js"></script>
    <script>
        // Check if user is already logged in
        window.addEventListener('DOMContentLoaded', () => {
            const user = JSON.parse(localStorage.getItem('berger_lms_user'));
            if (user && (user.user_type === 'DSE' || user.user_type === 'DSO' || user.user_type === 'ADMIN')) {
                window.location.href = 'dashboard.html';
            }
        });

        async function handleLogin(event) {
            event.preventDefault();
            const usernameInput = document.getElementById('username');
            const passwordInput = document.getElementById('password');
            const errorMessage = document.getElementById('errorMessage');
            const btnLogin = document.getElementById('btnLogin');
            const btnSpinner = document.getElementById('btnSpinner');

            // Reset UI State
            errorMessage.style.display = 'none';
            btnSpinner.style.display = 'inline-block';
            btnLogin.disabled = true;

            const username = usernameInput.value.trim();
            const password = passwordInput.value;

            try {
                const baseUrl = CONFIG.N8N_WEBHOOK_URL.endsWith('/') ? CONFIG.N8N_WEBHOOK_URL : CONFIG.N8N_WEBHOOK_URL + '/';
                const response = await fetch(`${baseUrl}login`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ username, password })
                });

                if (response.ok) {
                    const data = await response.json();
                    if (data && data.status === 'success' && data.user) {
                        // Save session
                        localStorage.setItem('berger_lms_user', JSON.stringify(data.user));
                        window.location.href = 'dashboard.html';
                        return;
                    }
                }

                // If not OK or invalid structure
                const errData = await response.json().catch(() => ({}));
                errorMessage.textContent = errData.message || "Invalid username or password. Please try again.";
                errorMessage.style.display = 'block';

            } catch (error) {
                console.error("Login request failed:", error);
                errorMessage.textContent = "Unable to connect to the server. Please try again later.";
                errorMessage.style.display = 'block';
            } finally {
                btnSpinner.style.display = 'none';
                btnLogin.disabled = false;
            }
        }
    </script>
</body>
</html>
