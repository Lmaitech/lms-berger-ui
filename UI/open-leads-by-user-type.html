<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Open Leads - Berger LMS</title>
    <!-- Google Fonts: Outfit -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --purple-main: #4a154b;
            --purple-light: #6b266d;
            --purple-dark: #300c31;
            --yellow-accent: #ffcc00;
            --yellow-hover: #e6b800;
            --text-dark: #1f1f1f;
            --text-muted: #757575;
            --bg-light: #f8f6fc;
            --card-bg: #ffffff;
            --border-radius: 20px;
            --shadow-lg: 0 20px 25px -5px rgba(74, 21, 75, 0.08), 0 10px 10px -5px rgba(74, 21, 75, 0.03);
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);

            /* Dynamic Role Colors */
            --role-accent: var(--purple-main);
            --role-gradient: linear-gradient(135deg, #6b266d 0%, #300c31 100%);
            --role-badge-bg: rgba(74, 21, 75, 0.08);
            --role-badge-text: var(--purple-main);
        }

        /* Retailer Theme Overrides */
        .theme-retailer {
            --role-accent: #2e7d32;
            --role-gradient: linear-gradient(135deg, #2e7d32 0%, #1b5e20 100%);
            --role-badge-bg: rgba(46, 125, 50, 0.1);
            --role-badge-text: #2e7d32;
        }

        /* Painter Theme Overrides */
        .theme-painter {
            --role-accent: #1565c0;
            --role-gradient: linear-gradient(135deg, #1976d2 0%, #0d47a1 100%);
            --role-badge-bg: rgba(21, 101, 192, 0.1);
            --role-badge-text: #1565c0;
        }

        /* Customer Theme Overrides */
        .theme-customer {
            --role-accent: #b7791f;
            --role-gradient: linear-gradient(135deg, #d69e2e 0%, #975a16 100%);
            --role-badge-bg: rgba(183, 121, 31, 0.1);
            --role-badge-text: #b7791f;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Outfit', sans-serif;
            background-color: var(--bg-light);
            color: var(--text-dark);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 16px;
            -webkit-tap-highlight-color: transparent;
        }

        .app-container {
            width: 100%;
            max-width: 480px;
            background: var(--card-bg);
            border-radius: var(--border-radius);
            box-shadow: var(--shadow-lg);
            overflow: hidden;
            border: 1px solid rgba(74, 21, 75, 0.05);
            margin-bottom: 40px;
            animation: slideUp 0.4s ease-out;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(15px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Header / Profile Styling */
        .app-header {
            background: var(--role-gradient);
            padding: 28px 24px;
            color: #ffffff;
            position: relative;
            border-bottom: 4px solid var(--yellow-accent);
            transition: var(--transition);
        }

        .brand-logo {
            font-size: 13px;
            font-weight: 800;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: var(--yellow-accent);
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .brand-logo svg {
            width: 16px;
            height: 16px;
            fill: var(--yellow-accent);
        }

        .user-profile {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .user-avatar {
            width: 54px;
            height: 54px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.15);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            font-weight: 700;
            border: 2px solid rgba(255, 255, 255, 0.2);
            color: #ffffff;
        }

        .user-info {
            flex: 1;
        }

        .user-name {
            font-size: 20px;
            font-weight: 700;
            line-height: 1.2;
            margin-bottom: 2px;
        }

        .user-meta {
            font-size: 13px;
            color: rgba(255, 255, 255, 0.85);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .role-badge {
            background: var(--yellow-accent);
            color: var(--purple-dark);
            font-weight: 800;
            padding: 2px 8px;
            border-radius: 12px;
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        /* Content List Section */
        .content-section {
            padding: 24px 20px;
        }

        .section-header {
            font-size: 18px;
            font-weight: 700;
            color: var(--purple-dark);
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .lead-count {
            font-size: 12px;
            font-weight: 700;
            background: var(--role-badge-bg);
            color: var(--role-badge-text);
            padding: 4px 10px;
            border-radius: 20px;
        }

        /* Lead Cards */
        .lead-list {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .lead-card {
            background: #ffffff;
            border: 1.5px solid #f0eaf5;
            border-radius: 16px;
            padding: 16px;
            cursor: pointer;
            position: relative;
            transition: var(--transition);
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.01);
        }

        .lead-card:hover {
            transform: translateY(-3px);
            border-color: var(--role-accent);
            box-shadow: 0 10px 15px -3px rgba(74, 21, 75, 0.05);
        }

        .lead-card:active {
            transform: translateY(-1px);
        }

        .lead-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 10px;
        }

        .lead-title {
            font-size: 16px;
            font-weight: 700;
            color: #1a1a1a;
            max-width: 70%;
        }

        .status-badge {
            font-size: 10px;
            font-weight: 800;
            padding: 4px 8px;
            border-radius: 20px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        /* Status Colors */
        .status-created {
            background: #e0e0e0;
            color: #616161;
        }

        .status-assigned {
            background: #fff3e0;
            color: #e65100;
        }

        .status-accepted {
            background: #e8f5e9;
            color: #2e7d32;
        }

        .status-visited {
            background: #e0f2f1;
            color: #00695c;
        }

        .status-followup {
            background: #f3e5f5;
            color: #6a1b9a;
        }

        .lead-body {
            font-size: 13px;
            color: var(--text-muted);
            margin-bottom: 12px;
            line-height: 1.4;
        }

        .lead-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-top: 1px dashed #f0eaf5;
            padding-top: 10px;
            font-size: 12px;
        }

        .lead-time {
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .lead-action-hint {
            font-weight: 700;
            color: var(--role-accent);
            display: flex;
            align-items: center;
            gap: 4px;
        }

        /* State Panels */
        .state-panel {
            display: none;
            padding: 40px 20px;
            text-align: center;
            animation: fadeIn 0.3s ease;
        }

        .state-panel.active {
            display: block;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
            }

            to {
                opacity: 1;
            }
        }

        .spinner {
            width: 44px;
            height: 44px;
            border: 4px solid rgba(74, 21, 75, 0.08);
            border-top-color: var(--purple-light);
            border-radius: 50%;
            animation: spin 1s infinite linear;
            margin: 0 auto 16px auto;
        }

        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }

        .state-icon {
            width: 64px;
            height: 64px;
            border-radius: 50%;
            background: #faf6fd;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 16px auto;
            color: var(--text-muted);
        }

        .state-icon svg {
            width: 32px;
            height: 32px;
            fill: currentColor;
        }

        .state-title {
            font-size: 18px;
            font-weight: 700;
            color: var(--purple-dark);
            margin-bottom: 8px;
        }

        .state-desc {
            font-size: 14px;
            color: var(--text-muted);
            line-height: 1.4;
            max-width: 280px;
            margin: 0 auto;
        }

        /* Modal Overlay CSS */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(48, 12, 49, 0.4);
            backdrop-filter: blur(8px);
            z-index: 1000;
            justify-content: center;
            align-items: flex-end;
            transition: opacity 0.3s ease;
        }

        .modal-overlay.active {
            display: flex;
        }

        .modal-card {
            background: #ffffff;
            width: 100%;
            max-width: 480px;
            border-radius: 24px 24px 0 0;
            padding: 24px;
            max-height: 90vh;
            overflow-y: auto;
            box-shadow: 0 -10px 25px rgba(0, 0, 0, 0.1);
            animation: slideInUp 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            border-top: 4px solid var(--role-accent);
        }

        @keyframes slideInUp {
            from {
                transform: translateY(100%);
            }

            to {
                transform: translateY(0);
            }
        }

        .modal-close {
            position: absolute;
            top: 16px;
            right: 16px;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            border: none;
            background: #f3eff5;
            color: var(--text-dark);
            font-size: 20px;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: var(--transition);
        }

        .modal-close:hover {
            background: #e5dde9;
        }

        .modal-title {
            font-size: 20px;
            font-weight: 800;
            color: var(--purple-dark);
            margin-bottom: 20px;
            padding-right: 32px;
        }

        /* Detail Items */
        .detail-section-title {
            font-size: 13px;
            text-transform: uppercase;
            font-weight: 800;
            color: var(--role-accent);
            letter-spacing: 0.5px;
            margin-top: 20px;
            margin-bottom: 12px;
            border-bottom: 1px solid #f0eaf5;
            padding-bottom: 4px;
        }

        .detail-section-title:first-of-type {
            margin-top: 0;
        }

        .detail-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
            font-size: 14px;
        }

        .detail-label {
            color: var(--text-muted);
            font-weight: 500;
        }

        .detail-val {
            color: var(--text-dark);
            font-weight: 600;
            text-align: right;
            max-width: 60%;
        }

        /* Timeline Layout styling */
        .timeline-wrapper {
            margin-top: 16px;
            position: relative;
            padding-left: 24px;
        }

        .timeline-wrapper::before {
            content: '';
            position: absolute;
            top: 4px;
            left: 7px;
            width: 2px;
            height: calc(100% - 16px);
            background: #e0dbe5;
        }

        .timeline-item {
            position: relative;
            margin-bottom: 20px;
        }

        .timeline-item:last-child {
            margin-bottom: 0;
        }

        .timeline-dot {
            position: absolute;
            left: -23px;
            top: 4px;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #ffffff;
            border: 3px solid var(--role-accent);
            box-shadow: 0 0 0 4px #ffffff;
            z-index: 1;
        }

        .timeline-content {
            background: #faf8fc;
            border-radius: 12px;
            padding: 12px;
            border: 1px solid #f0eaf5;
            text-align: left;
        }

        .timeline-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 6px;
        }

        .timeline-status {
            font-size: 12px;
            font-weight: 700;
            color: var(--purple-dark);
            text-transform: uppercase;
        }

        .timeline-time {
            font-size: 11px;
            color: var(--text-muted);
            font-weight: 500;
        }

        .timeline-remarks {
            font-size: 13px;
            color: var(--text-muted);
            line-height: 1.4;
        }

        .decline-attempts-box {
            margin-top: 8px;
            padding: 10px;
            background: #fff5f5;
            border-radius: 8px;
            border-left: 3px solid #e53e3e;
            font-size: 12px;
            display: none;
            animation: fadeIn 0.2s ease;
        }

        .decline-attempt-item {
            margin-bottom: 8px;
            padding-bottom: 8px;
            border-bottom: 1px dashed rgba(229, 62, 62, 0.15);
            text-align: left;
        }

        .decline-attempt-item:last-child {
            margin-bottom: 0;
            padding-bottom: 0;
            border-bottom: none;
        }
    </style>
</head>

<body>

    <div class="app-container" id="appRoot">
        <!-- Profile Header -->
        <header class="app-header">
            <div class="brand-logo">
                <svg viewBox="0 0 24 24">
                    <path d="M12 3L2 12h3v8h6v-6h2v6h6v-8h3L12 3zm1 11h-2v-2h2v2zm0-4h-2V7h2v3z" />
                </svg>
                Berger Paints CRM
            </div>

            <div class="user-profile">
                <div class="user-avatar" id="avatarLetter">-</div>
                <div class="user-info">
                    <h2 class="user-name" id="profileName">Retrieving Profile...</h2>
                    <div class="user-meta">
                        <span id="profileMobile">-</span>
                        <span class="role-badge" id="roleBadge">Role</span>
                    </div>
                </div>
            </div>
        </header>

        <!-- Loading State -->
        <div class="state-panel active" id="stateLoading">
            <div class="spinner"></div>
            <p style="color: var(--text-muted); font-size: 14px;">Fetching your open leads...</p>
        </div>

        <!-- Error State -->
        <div class="state-panel" id="stateError">
            <div class="state-icon" style="color: #c62828; background: #ffebee;">
                <svg viewBox="0 0 24 24">
                    <path
                        d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-2h2v2zm0-4h-2V7h2v6z" />
                </svg>
            </div>
            <h3 class="state-title">Unable to Load</h3>
            <p class="state-desc" id="errorMsg">Please verify the user link and try again.</p>
        </div>

        <!-- No Leads Empty State -->
        <div class="state-panel" id="stateEmpty">
            <div class="state-icon">
                <svg viewBox="0 0 24 24">
                    <path
                        d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-2 10H7v-2h10v2z" />
                </svg>
            </div>
            <h3 class="state-title">No Open Leads</h3>
            <p class="state-desc">You do not have any active leads assigned or matching your account at the moment.</p>
        </div>

        <!-- Main Leads List View -->
        <main class="content-section" id="stateList" style="display: none;">
            <div class="section-header">
                <span id="listHeading">Active Inquiries</span>
                <span class="lead-count" id="leadCounter">0 Leads</span>
            </div>

            <div class="lead-list" id="leadsWrapper">
                <!-- Dynamic cards populated here -->
            </div>
        </main>
    </div>

    <!-- Modal Overlay -->
    <div class="modal-overlay" id="detailModal">
        <div class="modal-card">
            <button class="modal-close" id="modalCloseBtn">&times;</button>
            <h3 class="modal-title">Lead Timeline Details</h3>
            <div class="modal-body" id="modalBody">
                <!-- Dynamic Content -->
            </div>
        </div>
    </div>

    <!-- Configuration Parameter Script -->
    <script src="config.js"></script>
    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const userId = urlParams.get('id') || urlParams.get('userid') || urlParams.get('user_id');

        // Panels
        const stateLoading = document.getElementById('stateLoading');
        const stateError = document.getElementById('stateError');
        const stateEmpty = document.getElementById('stateEmpty');
        const stateList = document.getElementById('stateList');

        // Header Elements
        const avatarLetter = document.getElementById('avatarLetter');
        const profileName = document.getElementById('profileName');
        const profileMobile = document.getElementById('profileMobile');
        const roleBadge = document.getElementById('roleBadge');

        // List Elements
        const listHeading = document.getElementById('listHeading');
        const leadCounter = document.getElementById('leadCounter');
        const leadsWrapper = document.getElementById('leadsWrapper');

        if (userId) {
            fetchOpenLeads();
        } else {
            showPanel(stateError);
            document.getElementById('errorMsg').textContent = "Access token is missing in the page link parameters.";
        }

        async function fetchOpenLeads() {
            try {
                const baseUrl = CONFIG.N8N_WEBHOOK_URL.endsWith('/') ? CONFIG.N8N_WEBHOOK_URL : CONFIG.N8N_WEBHOOK_URL + '/';
                const response = await fetch(`${baseUrl}user-open-leads?userid=${userId}`, { headers: { "Authorization": "Bearer " + CONFIG.API_TOKEN } });

                if (response.ok) {
                    let data = await response.json();

                    if (!data) {
                        showPanel(stateEmpty);
                        profileName.textContent = "Partner Account";
                        return;
                    }

                    // Normalize to array if it is a single object
                    if (!Array.isArray(data)) {
                        data = [data];
                    }

                    if (data.length === 0 || (data.length === 1 && !data[0].user_id)) {
                        showPanel(stateEmpty);
                        profileName.textContent = "Partner Account";
                        return;
                    }

                    // Render Profile details from first record
                    const userProfile = data[0];
                    profileName.textContent = userProfile.user_name || "Name Not Registered";
                    profileMobile.textContent = userProfile.user_mobile || "No Mobile";
                    avatarLetter.textContent = (userProfile.user_name || "U").charAt(0).toUpperCase();

                    const role = (userProfile.user_type || "CUSTOMER").toUpperCase();
                    roleBadge.textContent = role;

                    // Apply visual theme class to App Container
                    const container = document.getElementById('appRoot');
                    container.className = 'app-container theme-' + role.toLowerCase();

                    // Filter leads (checking if lead_id is not null)
                    const openLeads = data.filter(item => item.lead_id !== null);

                    // Update UI titles based on Role
                    if (role === 'RETAILER') {
                        listHeading.textContent = "Logged Client Sites";
                    } else if (role === 'PAINTER') {
                        listHeading.textContent = "Assigned Site Visits";
                    } else if (role === 'CUSTOMER') {
                        listHeading.textContent = "My Home Project Status";
                    } else {
                        listHeading.textContent = "Active Inquiries";
                    }

                    leadCounter.textContent = `${openLeads.length} Lead${openLeads.length !== 1 ? 's' : ''}`;

                    if (openLeads.length === 0) {
                        showPanel(stateEmpty);
                    } else {
                        renderLeadCards(openLeads, role);
                        showPanel(stateList);
                    }
                } else {
                    showPanel(stateError);
                    document.getElementById('errorMsg').textContent = "Failed to fetch account metrics from server. Status: " + response.status;
                }
            } catch (err) {
                console.error("Fetch error:", err);
                showPanel(stateError);
                document.getElementById('errorMsg').textContent = "Network error. Please check your connection and retry.";
            }
        }

        function renderLeadCards(leads, role) {
            leadsWrapper.innerHTML = "";

            leads.forEach(lead => {
                const card = document.createElement('div');
                card.className = 'lead-card';

                // Address description
                const streetPart = lead.address_line2 ? `, ${lead.address_line2}` : '';
                const fullAddress = `${lead.address_line1}${streetPart}, ${lead.town || ""}`;

                // Status mapping classes
                const statusClass = 'status-' + (lead.current_status || 'created').toLowerCase();
                const displayStatus = lead.current_status || 'CREATED';

                // Display parameters
                let mainTitle = lead.site_owner_name || "Waterproofing/Painting Site";
                let subDetails = "";
                let actionHintText = "";

                if (role === 'RETAILER') {
                    mainTitle = lead.site_owner_name || "New Site Opportunity";
                    subDetails = `<div>Location: ${fullAddress}</div><div>Type: ${lead.site_type || "General"} | Area: ${lead.carpet_area || "-"} sq ft</div>`;
                    actionHintText = "Track Progress";
                } else if (role === 'PAINTER') {
                    mainTitle = `${lead.town || "Site Location"}`;
                    subDetails = `<div>Address: ${lead.address_line1}</div><div>Scheduled Visit: ${lead.visit_date ? new Date(lead.visit_date).toLocaleDateString('en-IN') : "-"} at ${lead.visit_time || "-"}</div>`;
                    actionHintText = "Start Visit";
                } else if (role === 'CUSTOMER') {
                    mainTitle = `Home Project Status`;
                    subDetails = `<div>Status stage: <b>${displayStatus}</b></div><div>Visit schedule: ${lead.visit_date ? new Date(lead.visit_date).toLocaleDateString('en-IN') : "-"}</div>`;
                    actionHintText = "Track Progress";
                }

                // Render card HTML
                card.innerHTML = `
                    <div class="lead-header">
                        <div class="lead-title">${mainTitle}</div>
                        <span class="status-badge ${statusClass}">${displayStatus}</span>
                    </div>
                    <div class="lead-body">
                        ${subDetails}
                    </div>
                    <div class="lead-footer">
                        <div class="lead-time">
                            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="color: var(--text-muted);"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
                            ${lead.lead_created_at ? new Date(lead.lead_created_at).toLocaleDateString('en-IN') : "Recently Created"}
                        </div>
                        <div class="lead-action-hint">
                            <span>${actionHintText}</span>
                            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
                        </div>
                    </div>
                `;

                // Card Click Action to open detailed timeline modal
                card.addEventListener('click', () => {
                    openLeadDetailModal(lead.lead_id, role, lead);
                });

                leadsWrapper.appendChild(card);
            });
        }

        function showPanel(activePanel) {
            [stateLoading, stateError, stateEmpty, stateList].forEach(panel => {
                panel.style.display = "none";
            });

                            </div>` : ''}

                    // Timeline processing
                    let timelineItemsHTML = "";

                    // Count decline attempts
                    const declineAttempts = assignmentHistory.filter(item => item.response_status === 'REJECTED');

                    // Filter status history to make a clean progressions timeline (remove repetitive CREATED -> ASSIGNED -> CREATED loops)
                    const cleanStatusHistory = [];
                    let hasShownReassignments = false;

                    statusHistory.forEach(history => {
                        const status = history.new_status;
                        const isRevertedToCreated = (status === 'CREATED' && history.old_status === 'ASSIGNED');

                        if (isRevertedToCreated) {
                            if (!hasShownReassignments && declineAttempts.length > 0) {
                                cleanStatusHistory.push({
                                    isReassignmentGroup: true,
                                    changed_at: history.changed_at
                                });

                            }
                        } else if (status === 'ASSIGNED' && history.old_status === 'CREATED' && cleanStatusHistory.some(h => h.isReassignmentGroup)) {
                            return;
                        } else {
                            cleanStatusHistory.push(history);
                        }
                    });

                    // Render clean timeline
                    const istOptions = { timeZone: 'Asia/Kolkata', hour12: true, year: 'numeric', month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' };

                    cleanStatusHistory.forEach(item => {

                                            <span class="timeline-time">${new Date(item.changed_at).toLocaleString('en-IN', istOptions)}</span>

                                    <div class="timeline-dot"></div>
                                    <div class="timeline-content">
                                        <div class="timeline-header">

                                        </div>
                                        <div class="timeline-remarks">

                    let actionBtnHTML = "";

                                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polygon points="16.24 7.76 14.12 14.12 7.76 16.24 9.88 9.88 16.24 7.76"/></svg>
                                    Start Site Visit
                                </button>
                                <div id="visitFeedback" style="margin-top: 10px; font-size: 12px; text-align: center; display: none;"></div>
                            </div>

                    }

                    modalBody.innerHTML = `
                        <div class="detail-section-title">Site Location</div>

                        </div>
                        <div class="detail-row">

                        ${contactDetailsHTML}
                        
                        ${actionBtnHTML}

                        ${(role === 'RETAILER' || role === 'CUSTOMER') && leadSummary.latest_estimate_id ? `
                        <div style="margin-top: 16px; margin-bottom: 8px;">

                                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><polyline points="10 9 9 9 8 9"/></svg>

        // Painter Start Site Visit Handler
        function handleStartVisit(leadId, regLat, regLng, latestVisitNum, ownerName, ownerMobile, fullAddress, painterName = "", retailerName = "") {
            const btn = document.getElementById('startVisitBtn');
            const feedback = document.getElementById('visitFeedback');

            btn.disabled = true;
            btn.innerHTML = `<div class="spinner" style="width: 16px; height: 16px; margin: 0; border-width: 2.5px;"></div> Verifying Location...`;
            feedback.style.display = 'block';
            feedback.style.color = 'var(--text-muted)';
            feedback.textContent = 'Acquiring GPS coordinates...';

            if (!navigator.geolocation) {
                showFeedback('Geolocation is not supported by your browser.', '#c62828');
                btn.disabled = false;
                btn.innerHTML = `Start Site Visit`;
                return;
            }

            navigator.geolocation.getCurrentPosition(
                async (position) => {
                    const lat = position.coords.latitude;
                    const lng = position.coords.longitude;

                    // Geofencing verification
                    const isFirstVisit = (!regLat || parseFloat(regLat) === 0);

                    if (!isFirstVisit) {
                        // Calculate Haversine distance
                        const distance = calculateDistance(lat, lng, parseFloat(regLat), parseFloat(regLng));
                        if (distance > 50) {
                            showFeedback('Location mismatch: You are not within 50m of the registered site location. Please contact DSE or Admin to reset location.', '#c62828');
                            btn.disabled = false;
                            btn.innerHTML = `Start Site Visit`;
                            return;
                        }
                    }

                    feedback.textContent = 'Location verified. Logging visit...';

                    try {
                        const baseUrl = CONFIG.N8N_WEBHOOK_URL.endsWith('/') ? CONFIG.N8N_WEBHOOK_URL : CONFIG.N8N_WEBHOOK_URL + '/';
                        const response = await fetch(`${baseUrl}start-visit`, {
                            method: 'POST',
                            headers: {
                                'Content-Type': 'application/json',
                                'Authorization': 'Bearer ' + CONFIG.API_TOKEN
                            },
                            body: JSON.stringify({
                                lead_id: leadId,
                                painter_id: userId,
                                latitude: lat,
                                longitude: lng,
                                is_first_visit: isFirstVisit
                            })
                        });

                        if (response.ok) {
                            const result = await response.json();
                            showFeedback('Visit logged successfully! Redirecting to tools...', '#2e7d32');
                            setTimeout(() => {
                                window.location.href = `project-tools.html?lead_id=${leadId}&id=${userId}&visit_number=${result.visit_number}&owner_name=${encodeURIComponent(ownerName)}&owner_mobile=${ownerMobile}&address=${encodeURIComponent(fullAddress)}&painter_name=${encodeURIComponent(painterName)}&retailer_name=${encodeURIComponent(retailerName)}`;
                            }, 1500);
                        } else {
                            showFeedback('Failed to log site visit. Please try again.', '#c62828');
                            btn.disabled = false;
                            btn.innerHTML = `Start Site Visit`;
                        }
                    } catch (error) {
                        console.error('API Error:', error);
                        showFeedback('Network error logging visit. Check connection.', '#c62828');
                        btn.disabled = false;
                        btn.innerHTML = `Start Site Visit`;
                    }
                },
                (error) => {
                    console.error('GPS error:', error);
                    showFeedback('GPS Error: Please enable location permissions for this page.', '#c62828');
                    btn.disabled = false;
                    btn.innerHTML = `Start Site Visit`;
                },
                { enableHighAccuracy: true, timeout: 10000 }
            );

            function showFeedback(msg, color) {
                feedback.textContent = msg;
                feedback.style.color = color;
            }
        }

        // Haversine formula implementation
        function calculateDistance(lat1, lon1, lat2, lon2) {
            const R = 6371e3; // metres
            const phi1 = lat1 * Math.PI/180;
            const phi2 = lat2 * Math.PI/180;
            const deltaPhi = (lat2-lat1) * Math.PI/180;
            const deltaLambda = (lon2-lon1) * Math.PI/180;

            const a = Math.sin(deltaPhi/2) * Math.sin(deltaPhi/2) +
                      Math.cos(phi1) * Math.cos(phi2) *
                      Math.sin(deltaLambda/2) * Math.sin(deltaLambda/2);
            const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));

            return R * c; // in metres
        }
    </script>
